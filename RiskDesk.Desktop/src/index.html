<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Florida Hurricane Landfall Event Tracker</title>

  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-eval'; connect-src 'self' http://127.0.0.1:5202 ws://localhost:3000; style-src 'self' 'unsafe-inline';" />

</head>

<body>
  <h1>Florida Hurricane Landfall Event Tracker</h1>
  <p>Uses the NOAA Best Track Data (HURDAT2) to identify all hurricanes that have made landfall in Florida
    since 1900.</p>

  <button id="load-landfalls">Load Florida Landfalls</button>
  <p id="error-message" role="alert" hidden></p>

  <div id="summary">
    <div class="summary-card">
      <span class="summary-label">Storms analyzed</span>
      <strong id="storm-count">—</strong>

      <span class="summary-label">Florida Landfalls</span>
      <strong id="landfall-count">—</strong>
    </div>
  </div>

  <section id="results" hidden>
    <table>
      <thead>
        <tr>
          <th>Storm</th>
          <th>Landfall date</th>
          <th>Landfall wind</th>
          <th>Max Florida wind</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
  </section>

</body>

</html>
